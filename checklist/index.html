<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>D LAP 每日工作表</title>
<meta name="description" content="D LAP 每日工作表 Daily Checklist">
<meta name="theme-color" content="#15171a">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D LAP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{
  --bg:#eef0f3;
  --card:#fff;
  --ink:#16181c;
  --ink-2:#3d434b;
  --muted:#6b7380;
  --line:#d8dce2;
  --dark:#15171a;
  --wa:#179c4c;
  --radius:18px;
  --c:#15171a; --c-ink:#fff; --c-sub:rgba(255,255,255,.75); --c-soft:#eef0f3; --c-deep:#15171a;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}
/* 岗位颜色（跟纸本一样）A 蓝 · B 绿 · C 浅蓝 · D 橙 */
[data-role="A"]{--c:#1d5fc4;--c-ink:#fff;--c-sub:rgba(255,255,255,.8);--c-soft:#e6eefc;--c-deep:#1d5fc4}
[data-role="B"]{--c:#1f8f47;--c-ink:#fff;--c-sub:rgba(255,255,255,.8);--c-soft:#e2f3e8;--c-deep:#1f8f47}
[data-role="C"]{--c:#74c7ef;--c-ink:#0b2f45;--c-sub:rgba(11,47,69,.72);--c-soft:#e1f3fc;--c-deep:#1a86bd}
[data-role="D"]{--c:#f28a1e;--c-ink:#2a1500;--c-sub:rgba(42,21,0,.7);--c-soft:#fff0de;--c-deep:#d26a00}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Noto Sans Bengali","Kohinoor Bangla","Bangla Sangam MN","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:18px;line-height:1.4;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:calc(16px + var(--safe-l));padding-right:calc(16px + var(--safe-r))}
.en{color:var(--muted)}
.check{width:22px;height:22px;display:block}

/* ---------- 语言 ---------- */
.lang-row{display:flex;gap:8px}
.lang-btn{flex:1;min-height:52px;padding:6px 8px;border:2px solid var(--line);border-radius:14px;background:var(--card);font-size:18px;font-weight:800}
.lang-btn[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff}
#setup .lang-row{margin-top:18px}
.lang-box{margin-top:26px}
.lang-label{margin:0 2px 8px;font-size:16px;font-weight:700;color:var(--ink-2)}
.lang-label .en{margin-left:6px;font-size:13px;font-weight:500}

/* ---------- 第一页 ---------- */
.brandbar{background:var(--dark);color:#fff;padding:calc(20px + var(--safe-t)) 0 22px}
.brand{display:flex;align-items:center;gap:14px}
.logo{flex:none;font-weight:900;font-size:22px;letter-spacing:-.01em;line-height:1;background:#fff;color:var(--dark);padding:10px 12px;border-radius:12px;font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif}
.brand-t{font-size:28px;font-weight:800;line-height:1.15}
.brand-t .en{display:block;font-size:15px;font-weight:400;color:rgba(255,255,255,.62)}
.step{margin:26px 0}
.step-h{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:23px;font-weight:800;line-height:1.25}
.step-h .en{margin-left:8px;font-size:15px;font-weight:500}
.step-n{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--dark);color:#fff;font-size:18px}
.step.flash .step-h{animation:flash 1.1s ease}
@keyframes flash{0%,100%{color:inherit}20%,60%{color:#d22}}
.step.flash .step-n{animation:flashn 1.1s ease}
@keyframes flashn{0%,100%{background:var(--dark)}20%,60%{background:#d22}}

.branch-list{display:grid;gap:10px}
.opt-branch{display:flex;align-items:center;gap:14px;width:100%;min-height:70px;padding:10px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card);text-align:left;transition:background-color .15s,border-color .15s}
.opt-branch .code{flex:none;width:52px;font-size:26px;font-weight:900;letter-spacing:.02em;font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif}
.opt-branch .name{flex:1;min-width:0;font-size:19px;font-weight:600}
.opt-branch .ok,.opt-role .ok{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;border:3px solid #c3c8cf;color:transparent}
.opt-branch[aria-pressed="true"]{background:var(--dark);border-color:var(--dark);color:#fff}
.opt-branch[aria-pressed="true"] .ok{background:#fff;border-color:#fff;color:var(--dark)}

.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt-role{position:relative;display:flex;flex-direction:column;align-items:flex-start;min-height:124px;padding:14px 16px;border:0;border-radius:18px;background:var(--c);color:var(--c-ink);text-align:left;transition:box-shadow .15s}
.opt-role .letter{font-size:36px;font-weight:900;line-height:1;font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif}
.opt-role .zh{font-size:23px;font-weight:800;margin-top:8px;line-height:1.2}
.opt-role .sub{font-size:15px;color:var(--c-sub)}
.opt-role .ok{position:absolute;top:12px;right:12px;border-color:currentColor;opacity:.55}
.opt-role[aria-pressed="true"]{box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--dark)}
.opt-role[aria-pressed="true"] .ok{opacity:1;background:var(--c-ink);border-color:var(--c-ink);color:var(--c)}

.field{display:block;width:100%;min-height:62px;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:#fff;font-size:21px;-webkit-appearance:none;appearance:none}
.field::placeholder{color:#9aa1ab}
.field:focus{outline:none;border-color:var(--dark);box-shadow:0 0 0 4px rgba(21,23,26,.12)}

.start{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:74px;margin:6px 0 0;border:0;border-radius:18px;background:var(--dark);color:#fff;font-size:27px;font-weight:800}
.start .en{color:rgba(255,255,255,.65);font-size:17px;font-weight:600}
.start.not-ready{background:#9aa1ab}
.missing{min-height:1.4em;margin:10px 0 0;text-align:center;font-size:17px;font-weight:700;color:#c62020}
.missing .en{display:block;font-size:14px;font-weight:500}

/* ---------- 工作页 ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--c);color:var(--c-ink);padding:calc(10px + var(--safe-t)) 0 12px;box-shadow:0 2px 12px rgba(0,0,0,.14)}
.bar-row{display:flex;align-items:center;gap:12px}
.badge{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:12px;background:var(--c-ink);color:var(--c);font-size:28px;font-weight:900;font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif}
.badge.multi{grid-template-columns:1fr 1fr;gap:3px;place-items:stretch;background:none}
.badge.multi span{display:grid;place-items:center;border-radius:7px;background:var(--c);color:var(--c-ink);font-size:15px;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.who{flex:1;min-width:0}
.who-zh{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:22px;font-weight:800;line-height:1.2}
.who-en{font-size:14px;color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.change{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:66px;min-height:50px;padding:4px 12px;border:2px solid currentColor;border-radius:12px;background:transparent;color:var(--c-ink);font-size:18px;font-weight:800;line-height:1.1}
.change .en{font-size:11px;font-weight:600;color:inherit;opacity:.8}
.bar-row2{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:10px}
.date{font-size:20px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.date-sub{font-size:14px;color:var(--c-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.count{display:flex;align-items:baseline;gap:6px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.count-l{display:flex;flex-direction:column;align-items:flex-end;font-size:15px;font-weight:700;align-self:center;line-height:1.15}
.count-l .en{font-size:11px;font-weight:600;color:var(--c-sub)}
.count b{font-size:34px;font-weight:900}
.count .count-t{font-size:22px;font-weight:800;opacity:.8}
.meter{height:10px;margin-top:9px;border-radius:99px;background:rgba(0,0,0,.2);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:inherit;background:var(--c-ink);transition:width .3s ease}

.tap-hint{margin:14px 0 0;text-align:center;font-size:15px;color:var(--ink-2)}
.tap-hint .en{display:block;font-size:13px}
.role-h{display:flex;align-items:center;gap:12px;margin:26px 0 0;padding:12px 14px;border-radius:16px;background:var(--c);color:var(--c-ink)}
.role-h .rl{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--c-ink);color:var(--c);font-size:24px;font-weight:900;font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif}
.role-h .rn{flex:1;min-width:0;font-size:21px;font-weight:800;line-height:1.2}
.role-h .rn .en{display:block;font-size:13px;font-weight:500;color:var(--c-sub)}
.role-h .rc{flex:none;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.group{margin-top:22px}
.group-h{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
.group-t{flex:1;min-width:0;font-size:21px;font-weight:800;line-height:1.2}
.group-t .en{display:block;font-size:14px;font-weight:500}
.group-count{flex:none;padding:3px 11px;border-radius:99px;background:#dfe2e7;color:var(--ink-2);font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
.group.done .group-count{background:var(--c-deep);color:#fff}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:flex-start;gap:14px;width:100%;min-height:82px;padding:14px 16px;border:2px solid var(--line);border-radius:var(--radius);background:var(--card);text-align:left;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background-color .15s,border-color .15s,transform .08s}
.tile:active{transform:scale(.985)}
.tile:focus-visible,.opt-branch:focus-visible,.opt-role:focus-visible,.start:focus-visible,.wa:focus-visible,.lang-btn:focus-visible{outline:3px solid #2b6cff;outline-offset:2px}
.tick{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:3px solid #b6bcc5;background:#fff;color:#fff;transition:background-color .15s,border-color .15s}
.tick .check{opacity:0;transform:scale(.5);transition:opacity .15s,transform .15s}
.tile[aria-pressed="true"]{background:var(--c-soft);border-color:var(--c-deep)}
.tile[aria-pressed="true"] .tick{background:var(--c-deep);border-color:var(--c-deep)}
.tile[aria-pressed="true"] .tick .check{opacity:1;transform:none}
.t-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.t-main{font-size:20px;font-weight:600;line-height:1.38;color:var(--ink)}
.t-sub{font-size:15px;line-height:1.35;color:var(--muted)}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:2px 9px;border-radius:99px;background:#eceef1;color:var(--ink-2);font-size:13px;font-weight:700;line-height:1.5}
.chip .en{font-weight:500}
.tile[aria-pressed="true"] .chip{background:rgba(255,255,255,.85)}

.card{margin-top:22px;padding:16px;border:2px solid var(--line);border-radius:var(--radius);background:var(--card)}
.card-h{display:block;font-size:20px;font-weight:800;line-height:1.25}
.card-h .en{display:block;margin-top:2px;font-size:14px;font-weight:500}
.card .field{margin-top:12px}
textarea.field{min-height:116px;resize:vertical;font-size:19px;line-height:1.45}

.wa{display:flex;align-items:center;justify-content:center;gap:14px;width:100%;min-height:84px;margin-top:24px;padding:10px 18px;border:0;border-radius:20px;background:var(--wa);color:#fff;text-align:left;text-decoration:none;box-shadow:0 6px 18px rgba(23,156,76,.32);transition:transform .08s}
.wa:active{transform:scale(.985)}
.wa svg{flex:none;width:42px;height:42px}
.wa-t{display:block;font-size:26px;font-weight:900;line-height:1.15}
.wa-t .en{display:block;font-size:15px;font-weight:400;color:#fff;opacity:.88}
.hint{margin:10px 0 0;text-align:center;font-size:16px;color:var(--ink-2)}
.hint .en{display:block;font-size:13px}
.sent{margin:12px 0 0;padding:10px 14px;border-radius:14px;background:#e2f3e8;color:#14532d;text-align:center;font-size:16px;font-weight:700}
.sent .en{display:block;font-size:13px;font-weight:500;color:#3f6b50}
.ghost{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-height:58px;margin-top:16px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);text-decoration:none;font-size:17px;font-weight:700;line-height:1.2;text-align:center}
.ghost .en{font-size:13px;font-weight:500}

.install{margin-top:22px;border-radius:var(--radius);background:#e3e6ea}
.install summary{display:flex;align-items:center;gap:10px;padding:14px 16px;font-size:18px;font-weight:800;cursor:pointer;list-style:none}
.install summary::-webkit-details-marker{display:none}
.install summary .en{display:block;font-size:13px;font-weight:500}
.install summary::after{content:"＋";margin-left:auto;font-size:22px;color:var(--muted)}
.install[open] summary::after{content:"－"}
.install-body{padding:0 16px 16px;font-size:17px}
.install-body ol{margin:0;padding-left:1.3em}
.install-body li{margin:6px 0}
.install-body .en{display:block;font-size:13px}
.install-body .note{margin:12px 0 0;font-size:15px;color:var(--ink-2)}
.install-btn{width:100%;min-height:58px;border:0;border-radius:14px;background:var(--dark);color:#fff;font-size:20px;font-weight:800}
.ios-share{display:inline-block;width:20px;height:20px;vertical-align:-3px}
.foot{margin:26px 0 0;padding-bottom:calc(30px + var(--safe-b));text-align:center;font-size:13px;color:#9aa1ab}

.toast{position:fixed;left:0;right:0;bottom:calc(24px + var(--safe-b));z-index:20;width:-webkit-fit-content;width:fit-content;max-width:calc(100% - 32px);margin:0 auto;padding:14px 20px;border-radius:16px;background:rgba(21,23,26,.94);color:#fff;font-size:18px;font-weight:800;text-align:center;line-height:1.3;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transform:translateY(16px);transition:opacity .2s,transform .2s}
.toast small{display:block;margin-top:2px;font-size:13px;font-weight:500;color:rgba(255,255,255,.72)}
.toast.show{opacity:1;transform:none}

@media (min-width:600px){ .tiles{gap:12px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<!-- ================= 第一页：语言、分行、岗位、名字 ================= -->
<div id="setup" hidden>
  <header class="brandbar">
    <div class="wrap brand">
      <div class="logo">D LAP</div>
      <div class="brand-t" data-t="appTitle"></div>
    </div>
  </header>
  <main class="wrap">
    <div class="lang-row" role="group" aria-label="Language"></div>
    <section class="step" id="stepBranch">
      <h2 class="step-h"><span class="step-n">1</span><span data-t="chooseOutlet"></span></h2>
      <div class="branch-list" id="branchList"></div>
    </section>
    <section class="step" id="stepRole">
      <h2 class="step-h"><span class="step-n">2</span><span data-t="chooseRole"></span></h2>
      <div class="role-grid" id="roleGrid"></div>
    </section>
    <section class="step" id="stepName">
      <h2 class="step-h"><span class="step-n">3</span><span data-t="yourName"></span></h2>
      <input id="nameInput" class="field" type="text" maxlength="30" autocomplete="name" enterkeyhint="done" data-ph="namePh">
    </section>
    <button id="startBtn" class="start" type="button" data-t="start"></button>
    <p id="missing" class="missing" aria-live="polite"></p>
    <div class="install-slot" data-open="1"></div>
    <p class="foot">D LAP · Daily Checklist</p>
  </main>
</div>

<!-- ================= 工作页 ================= -->
<div id="work" hidden>
  <header class="bar">
    <div class="wrap">
      <div class="bar-row">
        <div class="badge" id="badge"></div>
        <div class="who">
          <div class="who-zh" id="whoMain"></div>
          <div class="who-en" id="whoSub"></div>
        </div>
        <button class="change" id="changeBtn" type="button" data-t="change"></button>
      </div>
      <div class="bar-row2">
        <div>
          <div class="date" id="dateMain"></div>
          <div class="date-sub" id="dateSub"></div>
        </div>
        <div class="count">
          <span class="count-l" id="countL"></span>
          <b id="doneN">0</b><span class="count-t">/<span id="totalN">0</span></span>
        </div>
      </div>
      <div class="meter"><i id="meter"></i></div>
    </div>
  </header>

  <main class="wrap">
    <p class="tap-hint" data-t="tapHint"></p>
    <div id="list"></div>

    <section class="card" id="kartCard">
      <label class="card-h" for="kartInput" data-t="karts"></label>
      <input id="kartInput" class="field" type="text" maxlength="100" enterkeyhint="done" data-ph="kartsPh">
    </section>

    <section class="card">
      <label class="card-h" for="noteInput" data-t="note"></label>
      <textarea id="noteInput" class="field" rows="3" maxlength="1000" data-ph="notePh"></textarea>
    </section>

    <button id="waBtn" class="wa" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11.6a8.4 8.4 0 0 1-12.4 7.4L3.5 20.5l1.5-4.4a8.4 8.4 0 1 1 15.5-4.5z"/><path d="M8.5 11.8l2.3 2.3 4.7-4.7"/></svg>
      <span class="wa-t" data-t="sendPdf"></span>
    </button>
    <p class="hint" data-t="sendHint"></p>
    <p class="sent" id="sentNote" hidden></p>

    <a id="textBtn" class="ghost" href="https://wa.me/" data-t="textOnly"></a>

    <div class="lang-box">
      <div class="lang-label" data-t="language"></div>
      <div class="lang-row" role="group" aria-label="Language"></div>
    </div>
    <div class="install-slot"></div>
    <p class="foot">D LAP · Daily Checklist</p>
  </main>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function () {
'use strict';

/* =====================================================================
   工作内容 —— 要修改就改这里
   ---------------------------------------------------------------------
   格式：  编号 | 华文 | English | 时间 | 简称（可不写）
   分类：  ## 分类华文 | English
   · 「简称」是报告「未做：」里显示的短名字。不写的话，
     自动用华文「：」或「，」前面的字。
   · 华文里有（一、三、六）→ 只在星期一、三、六出现
   · 华文里有（SF & SP）、（SF/Paragon）→ 只给那些分行
   · 改了这里，下面的孟加拉文翻译（BN）也要跟着改
   ===================================================================== */
var TASKS = {
A: `
## 开店前 | Before opening
1 | 开店确认钱对不对 | Check the cash float is correct | 开店前
2 | 确认 Display TV 已打开 | Display TV switched on | 开店前 | Display TV
3 | 收银系统：POS 开机正常，打印纸充足 | POS on, receipt paper full | 开店前

            typeof profile.name === 'string' && profile.name.trim());
}
/* 换天就清空。返回 true = 刚刚换了一天 */
function ensureDay() {
  var key = dateKey(bizDate());
  if (!day) day = load(KEY_DAY);
  if (!day || day.date !== key || !day.lists || typeof day.lists !== 'object') {
    var rolled = !!(day && day.date && day.date !== key);
    day = { date: key, lists: {} };
    store(KEY_DAY, day);
    return rolled;
  }
  return false;
}
/* 每个分行一份记录（几个岗位一起） */
function current() {
  var k = profile.branch;
  if (!day.lists[k]) {
    var L = { done: {}, note: '', karts: '', sentAt: null };
    Object.keys(day.lists).forEach(function (key) {      // 旧版资料：按「分行|岗位」分开存
      if (key.indexOf(k + '|') !== 0) return;
      var o = day.lists[key] || {};
      Object.assign(L.done, o.done || {});
      if (o.note && !L.note) L.note = o.note;
      if (o.karts && !L.karts) L.karts = o.karts;
    });
    day.lists[k] = L;
  }
  return day.lists[k];
}
function persist() { store(KEY_DAY, day); }

function branchOf(code) { return BRANCHES.filter(function (b) { return b.code === code; })[0]; }
function multi() { return profile.roles.length > 1; }
function numLabel(it) { return (multi() ? it.role : '') + it.n; }
function rolesZh() { return profile.roles.map(function (r) { return r + ' ' + ROLES[r].zh; }).join(' + '); }
function rolesEn() { return profile.roles.map(function (r) { return ROLES[r].en; }).join(' + '); }
function theme() { return multi() ? NEUTRAL : ROLES[profile.roles[0]]; }

/* 今天要做的：按岗位分段；两个岗位有同一项工作只出现一次 */
var today = { sections: [], flat: [] };
function buildToday() {
  var dow = bizDate().getDay(), seen = {}, out = { sections: [], flat: [] };
  profile.roles.forEach(function (r) {
    var groups = [];
    GROUPS[r].forEach(function (g) {
      var items = g.items.filter(function (it) {
        if (!applies(it, profile.branch, dow) || seen[it.zh]) return false;
        seen[it.zh] = true;
        return true;
      });
      if (!items.length) return;
      groups.push({ g: g, items: items });
      items.forEach(function (it) { out.flat.push(it); });
    });
    if (groups.length) out.sections.push({ role: r, groups: groups });
  });
  return out;
}

/* ================= 第一页 ================= */
var pick = { branch: null, roles: [] };

  var bl = $('branchList');

    var btn = el('button', 'opt-branch');

    btn.dataset.code = b.code;
    btn.appendChild(el('span', 'code', b.code));
    btn.appendChild(el('span', 'name', b.name));
    var ok = el('span', 'ok'); ok.innerHTML = CHECK_SVG; btn.appendChild(ok);
    btn.addEventListener('click', function () { pick.branch = b.code; buzz(); syncSetup(); });
    bl.appendChild(btn);
  });
  var rg = $('roleGrid');
  ROLE_ORDER.forEach(function (code) {
    var btn = el('button', 'opt-role');

}
function missingSteps() {

  if (!$('nameInput').value.trim()) m.push(['stepName', 'needName']);

}
function syncSetup() {
  document.querySelectorAll('.opt-branch').forEach(function (b) {
    b.setAttribute('aria-pressed', b.dataset.code === pick.branch ? 'true' : 'false');
  });
  document.querySelectorAll('.opt-role').forEach(function (b) {
    b.setAttribute('aria-pressed', pick.roles.indexOf(b.dataset.role) !== -1 ? 'true' : 'false');
  });
  var miss = missingSteps();
  $('startBtn').classList.toggle('not-ready', miss.length > 0);

}
function showMissing(miss) {
  var sep = lang === 'zh' ? '、' : ', ';
  fill($('missing'),
    tx('stillNeed') + miss.map(function (x) { return tx(x[1]); }).join(sep),
    lang === 'en' ? '' : T.stillNeed.en + miss.map(function (x) { return T[x[1]].en; }).join(', '));
}
function onStart() {

    var step = $(miss[0][0]);
    step.classList.remove('flash'); void step.offsetWidth; step.classList.add('flash');
    step.scrollIntoView({ behavior: 'smooth', block: 'center' });

function showSetup() {

/* ================= 工作页 ================= */

  $('dateSub').textContent = (lang === 'en' ? '' : WEEK_EN[dow] + ' · ') + profile.name;

  today = buildToday();

  list.textContent = '';

    var wrap = el('div', 'role-sec');
    wrap.dataset.role = sec.role;

      gh.appendChild(gt);
      gh.appendChild(el('span', 'group-count'));
      box.appendChild(gh);
      var tiles = el('div', 'tiles');
      gg.items.forEach(function (it) { all.push(it.id); tiles.appendChild(makeTile(it, !!L.done[it.id])); });
      box.appendChild(tiles);
      wrap.appendChild(box);
    });
    wrap.dataset.ids = all.join(',');

  });

  $('kartCard').hidden = profile.roles.indexOf('D') === -1;
  $('kartInput').value = L.karts || '';

function makeTile(it, done) {
  var b = el('button', 'tile');
  b.type = 'button';
  b.dataset.id = it.id;
  b.setAttribute('aria-pressed', done ? 'true' : 'false');
  var tick = el('span', 'tick'); tick.innerHTML = CHECK_SVG; b.appendChild(tick);
  var body = el('span', 't-body');
  body.appendChild(el('span', 't-main', itemMain(it)));

  var meta = el('span', 't-meta');
  meta.appendChild(el('span', 'chip', '#' + numLabel(it)));
  if (it.time) {
    var chip = el('span', 'chip', wordMain(it.time, TIME_EN[it.time]));
    var ts = wordSub(it.time, TIME_EN[it.time]);
    if (ts) chip.appendChild(el('span', 'en', ' ' + ts));

  }
  body.appendChild(meta);

function checkNewDay() {

  if (!$('work').hidden && validProfile()) {
    renderWork();
    toast('newDay');
  }
  return true;
}
function toggle(tile) {
  if (checkNewDay()) return;
  var L = current(), id = tile.dataset.id;
  if (L.done[id]) delete L.done[id]; else L.done[id] = Date.now();
  persist();
  tile.setAttribute('aria-pressed', L.done[id] ? 'true' : 'false');
  buzz();
  updateProgress(true);
}
function stats() {
  var L = current(), done = 0, undone = [];
  today.flat.forEach(function (it) { if (L.done[it.id]) done++; else undone.push(it); });
  return { done: done, total: today.flat.length, undone: undone };
}
function countIds(ids) {
  var L = current(), n = 0;
  ids.forEach(function (id) { if (L.done[id]) n++; });
  return n;
}
function updateProgress(fromTap) {
  var s = stats();
  var all = s.total > 0 && s.done === s.total;
  $('doneN').textContent = s.done;
  $('totalN').textContent = s.total;
  $('meter').style.width = (s.total ? s.done / s.total * 100 : 0) + '%';
  fill($('countL'), tx(all ? 'allDone' : 'done'), txSub(all ? 'allDone' : 'done'));
  document.querySelectorAll('#list .group').forEach(function (sec) {
    var ids = sec.dataset.ids.split(','), n = countIds(ids);
    sec.querySelector('.group-count').textContent = n + '/' + ids.length;

/* ---------------- PDF 报告（在手机里直接做，不用上网；固定华文 + 英文） ---------------- */
var PDF_W = 595.28, PDF_H = 841.89;   // A4（point）
var PDF_S = 2.5;                       // 画质：约 180 dpi
var PDF_FONT = '"PingFang SC","Hiragino Sans GB","Heiti SC","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei","Droid Sans Fallback","Noto Sans Bengali","Kohinoor Bangla",sans-serif';
var NO_LINE_START = /^[，、。：；！？）」』】,.:;!?)]/;

function pf(size, weight) { return (weight || 400) + ' ' + size + 'px ' + PDF_FONT; }
function wrapText(ctx, str, maxW) {
  var tokens = String(str).match(/[\x21-\x7E]+[ \t]*|[ \t]+|\n|[\s\S]/gu) || [];
  var lines = [], line = '';
  var w = function (s) { return ctx.measureText(s.replace(/\s+$/, '')).width; };
  var flush = function () { lines.push(line.replace(/\s+$/, '')); line = ''; };
  tokens.forEach(function (t) {
    if (t === '\n') { flush(); return; }
    if (!line && /^\s+$/.test(t)) return;
    if (w(line + t) <= maxW || NO_LINE_START.test(t)) { line += t; return; }
    if (line) flush();
    if (/^\s+$/.test(t)) return;
    if (w(t) <= maxW) { line = t; return; }
    Array.from(t).forEach(function (ch) {
      if (line && w(line + ch) > maxW) flush();
      line += ch;
    });
  });
  if (line.replace(/\s+$/, '') || !lines.length) flush();
  return lines;
}
function fitFont(ctx, str, maxW, size, weight) {
  ctx.font = pf(size, weight);
  while (size > 7 && ctx.measureText(str).width > maxW) { size -= 0.5; ctx.font = pf(size, weight); }
}

function renderReportPages() {

    m.zl.forEach(function (ln, i) { txt(ln, COL.task + 6, base + i * 14, 11, 600, '#16181c'); });
    var ey = base + (m.zl.length - 1) * 14 + 12.5;
    m.en.forEach(function (ln, i) { txt(ln, COL.task + 6, ey + i * 10, 8, 400, '#6b7380'); });
    m.tl.forEach(function (ln, i) { txt(ln, COL.time + 6, base + i * 12, 9, 400, '#3d434b'); });
    var cx = COL.status + 14, cy = y + 12.5;
    ctx.beginPath(); ctx.arc(cx, cy, 7.5, 0, Math.PI * 2);
    ctx.fillStyle = done ? '#1b8a45' : '#d02a2a'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.8; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    if (done) { ctx.moveTo(cx - 3.6, cy + 0.2); ctx.lineTo(cx - 1, cy + 2.8); ctx.lineTo(cx + 3.8, cy - 2.6); }
    else { ctx.moveTo(cx - 3, cy - 3); ctx.lineTo(cx + 3, cy + 3); ctx.moveTo(cx + 3, cy - 3); ctx.lineTo(cx - 3, cy + 3); }
    ctx.stroke();
    if (done) {
      txt('完成', cx + 12, base, 9.5, 700, '#1b7a3e');
      if (typeof ts === 'number') { ctx.font = pf(9.5, 700); txt(fmtTime(ts), cx + 15 + ctx.measureText('完成').width, base, 8.5, 400, '#6b7380'); }
    } else {
      txt('未做', cx + 12, base, 10, 800, '#c62020');
    }
    ctx.strokeStyle = '#e3e6ea'; ctx.lineWidth = 0.75;
    ctx.beginPath(); ctx.moveTo(X0, y + m.h); ctx.lineTo(X1, y + m.h); ctx.stroke();
    y += m.h;
  }
  function noteBox(title, body, tone) {
    var c = tone === 'bad' ? ['#fff5f5', '#f1b5b5', '#c62020'] : tone === 'good' ? ['#eef8f1', '#b6dfc3', '#1b7a3e'] : ['#f6f7f9', '#d8dce2', '#16181c'];
    ctx.font = pf(11, 400);
    var lines = body ? wrapText(ctx, body, TW - 24) : [];
    var h = lines.length ? 34 + lines.length * 16 : 30;
    room(h);
    box(X0, y, TW, h, c[0], c[1]);
    txt(title, X0 + 12, y + 20, 11, 800, c[2]);
    lines.forEach(function (ln, i) { txt(ln, X0 + 12, y + 40 + i * 16, 11, 400, '#16181c'); });
    y += h + 10;
  }

  newPage();
  if (s.undone.length) {
    noteBox('未做 Not done（' + s.undone.length + '）', s.undone.map(function (it) { return '#' + numLabel(it) + ' ' + it.short; }).join('、'), 'bad');
  } else {
    noteBox('全部完成 ✓ All done', '', 'good');
  }
  var note = (L.note || '').trim();
  if (note) noteBox('今天的异常／需要跟进 Problems / follow-up', note, '');
  else noteBox('今天的异常／需要跟进：没有　Problems / follow-up: none', '', '');
  y += 4;
  inTable = true;
  drawTableHead();
  today.sections.forEach(function (sec) {
    var R = ROLES[sec.role], first = true;
    var ids = [];
    sec.groups.forEach(function (gg) { gg.items.forEach(function (it) { ids.push(it.id); }); });
    sec.groups.forEach(function (gg) {
      var ms = gg.items.map(measureItem);
      if (first && isMulti) { room(24 + 20 + ms[0].h); drawRole(sec.role, ids); }
      first = false;
      room(20 + ms[0].h);
      drawGroup(gg.g, gg.items.map(function (it) { return it.id; }), isMulti ? R.soft : th.soft);
      gg.items.forEach(function (it, i) { room(ms[i].h); drawItem(it, ms[i]); });
    });
  });
  inTable = false;

  var made = fmtDate(new Date(now)) + ' ' + fmtTime(now);
  pages.forEach(function (cv, i) {
    ctx = cv.getContext('2d');
    ctx.strokeStyle = '#d8dce2'; ctx.lineWidth = 0.75;
    ctx.beginPath(); ctx.moveTo(X0, PDF_H - 30); ctx.lineTo(X1, PDF_H - 30); ctx.stroke();
    txt('D LAP 每日工作表 · ' + profile.branch + ' · ' + profile.roles.join('+') + ' · ' + dateStr, X0, PDF_H - 17, 8, 400, '#8a919b');
    txt('产生时间 ' + made + ' · 第 ' + (i + 1) + '/' + pages.length + ' 页', X1, PDF_H - 17, 8, 400, '#8a919b', 'right');
  });
  return pages;
}

function dataUrlBytes(url) {
  var bin = atob(url.slice(url.indexOf(',') + 1)), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function pdfText(str) {
  var hex = 'FEFF';
  for (var i = 0; i < str.length; i++) hex += ('000' + str.charCodeAt(i).toString(16)).slice(-4).toUpperCase();
  return '<' + hex + '>';
}
/* 把每页 JPEG 放进一个 PDF 文件 */
function buildPdf(images, title) {
  var parts = [], pos = 0, offsets = [];
  function add(x) {
    if (typeof x === 'string') {
      var a = new Uint8Array(x.length);
      for (var i = 0; i < x.length; i++) a[i] = x.charCodeAt(i) & 255;
      x = a;
    }
    parts.push(x); pos += x.length;
  }
  function obj(id, dict, stream) {
    offsets[id] = pos;
    add(id + ' 0 obj\n' + dict);
    if (stream) { add('\nstream\n'); add(stream); add('\nendstream'); }
    add('\nendobj\n');
  }
  var n = images.length, kids = [], W = PDF_W.toFixed(2), H = PDF_H.toFixed(2), t = new Date();
  var stamp = t.getFullYear() + pad(t.getMonth() + 1) + pad(t.getDate()) + pad(t.getHours()) + pad(t.getMinutes()) + pad(t.getSeconds());
  for (var i = 0; i < n; i++) kids.push((4 + i * 3) + ' 0 R');
  add('%PDF-1.4\n'); add(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + n + ' >>');
  obj(3, '<< /Title ' + pdfText(title) + ' /Producer (D LAP Daily Checklist) /CreationDate (D:' + stamp + ') >>');
  images.forEach(function (img, i) {
    var p = 4 + i * 3, content = 'q ' + W + ' 0 0 ' + H + ' 0 0 cm /Im0 Do Q';
    obj(p, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + W + ' ' + H + '] /Resources << /XObject << /Im0 ' + (p + 2) + ' 0 R >> >> /Contents ' + (p + 1) + ' 0 R >>');
    obj(p + 1, '<< /Length ' + content.length + ' >>', content);
    obj(p + 2, '<< /Type /XObject /Subtype /Image /Width ' + img.w + ' /Height ' + img.h +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + img.bytes.length + ' >>', img.bytes);
  });
  var size = 4 + n * 3, xrefAt = pos, xref = 'xref\n0 ' + size + '\n0000000000 65535 f \n';
  for (var j = 1; j < size; j++) xref += ('000000000' + offsets[j]).slice(-10) + ' 00000 n \n';
  add(xref);
  add('trailer\n<< /Size ' + size + ' /Root 1 0 R /Info 3 0 R >>\nstartxref\n' + xrefAt + '\n%%EOF\n');
  return new Blob(parts, { type: 'application/pdf' });
}
/* 文件名只用英文字母和数字（有些手机不接受华文文件名）；华文名字已经印在 PDF 里 */
function reportFileName() {
  var d = bizDate();
  var nm = profile.name.replace(/[^A-Za-z0-9 ._-]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 30);
  return ['DLAP', profile.branch, profile.roles.join('+'),
    pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear(), nm].filter(Boolean).join(' ') + '.pdf';
}
function makePdfFile() {
  var pages = renderReportPages();
  var images = pages.map(function (cv) {
    var img = { w: cv.width, h: cv.height, bytes: dataUrlBytes(cv.toDataURL('image/jpeg', 0.85)) };
    cv.width = cv.height = 0;   // 释放手机记忆体
    return img;
  });
  var d = bizDate();
  var blob = buildPdf(images, 'D LAP 每日工作 ' + fmtDate(d) + ' ' + profile.branch + ' ' + rolesZh() + ' ' + profile.name);
  return new File([blob], reportFileName(), { type: 'application/pdf' });
}
function saveFile(file) {
  var url = URL.createObjectURL(file), a = document.createElement('a');
  a.href = url; a.download = file.name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  markSent('file');
  toast('pdfSaved', 6000);
}
/* 一定要在按钮的 click 里马上做完（iPhone 才肯打开分享选单） */
function sharePdf() {
  if (checkNewDay()) return;
  var file;
  try { file = makePdfFile(); }
  catch (err) { toast('pdfFail', 5000); return; }
  var data = { files: [file] };
  if (navigator.share && navigator.canShare && navigator.canShare(data)) {
    navigator.share(data).then(function () { markSent('pdf'); }, function (err) {
      if (err && err.name === 'AbortError') return;   // 自己按了取消
      saveFile(file);
    });
  } else {
    saveFile(file);
  }
}

function bindWork() {
  $('list').addEventListener('click', function (e) {
    var t = e.target.closest('.tile');
    if (t) toggle(t);
  });
  $('noteInput').addEventListener('input', function () {
    current().note = this.value; persist(); refreshMessage();
  });
  $('kartInput').addEventListener('input', function () {
    current().karts = this.value; persist(); refreshMessage();
  });
  $('kartInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); this.blur(); } });
  $('waBtn').addEventListener('click', sharePdf);
  $('textBtn').addEventListener('click', function (e) {
    if (checkNewDay()) { e.preventDefault(); return; }
    refreshMessage();
    markSent('text');
  });
  $('changeBtn').addEventListener('click', function () {
    history.pushState({ s: 'setup' }, '');
    showSetup();
  });
  window.addEventListener('popstate', function () {
    if (validProfile()) showWork(); else showSetup();
  });
}

/* ---------------- 语言按钮 ---------------- */
function buildLangRows() {
  document.querySelectorAll('.lang-row').forEach(function (row) {
    LANGS.forEach(function (l) {
      var b = el('button', 'lang-btn', l[1]);
      b.type = 'button';
      b.dataset.lang = l[0];
      b.lang = l[2];
      b.addEventListener('click', function () { setLang(l[0]); });
      row.appendChild(b);
    });
  });
}
function setLang(code) {
  if (code === lang) return;
  lang = code;
  store(KEY_LANG, lang);
  buzz();
  applyLang();
}
function applyLang() {
  document.documentElement.lang = LANGS.filter(function (l) { return l[0] === lang; })[0][2];
  document.querySelectorAll('[data-t]').forEach(function (n) { fill(n, tx(n.dataset.t), txSub(n.dataset.t)); });
  document.querySelectorAll('[data-ph]').forEach(function (n) { n.placeholder = tx(n.dataset.ph); });
  document.querySelectorAll('.lang-btn').forEach(function (b) {
    b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
  });
  labelRoles();
  if ($('missing').textContent) showMissing(missingSteps());
  renderInstall();
  if (!$('work').hidden && validProfile()) renderWork();
}

/* ---------------- 加到主屏幕 ---------------- */
var installPrompt = null;
function isStandalone() {
  return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
}
function isIOS() {
  return /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
var SHARE_SVG = '<svg class="ios-share" viewBox="0 0 24 24" fill="none" stroke="#1d6fe0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M8 7l4-4 4 4"/><path d="M6 11H5a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-8a1 1 0 0 0-1-1h-1"/></svg>';
function stepLi(key, icon) {
  var li = el('li', '', tx(key));
  if (icon) { var s = el('span'); s.innerHTML = ' ' + icon; li.appendChild(s); }
  if (txSub(key)) li.appendChild(el('span', 'en', txSub(key)));
  return li;
}
function renderInstall() {
  document.querySelectorAll('.install-slot').forEach(function (slot) {
    var wasOpen = slot.firstChild ? slot.firstChild.open : !!slot.dataset.open;
    slot.textContent = '';
    if (isStandalone()) return;
    var det = el('details', 'install');
    det.open = wasOpen;
    var sum = el('summary');
    sum.appendChild(el('span', '', '📲'));
    var st = el('span');
    fill(st, tx('installTitle'), txSub('installTitle'));
    sum.appendChild(st);
    det.appendChild(sum);
    var body = el('div', 'install-body');
    if (installPrompt) {
      var btn = el('button', 'install-btn', tx('installBtn'));
      btn.type = 'button';
      btn.addEventListener('click', function () {
        installPrompt.prompt();
        installPrompt.userChoice.then(function () { installPrompt = null; renderInstall(); }, function () {});
      });
      body.appendChild(btn);
    } else if (isIOS()) {
      var ol = el('ol');
      ol.appendChild(stepLi('ios1', SHARE_SVG));
      ol.appendChild(stepLi('ios2'));
      ol.appendChild(stepLi('ios3'));
      body.appendChild(ol);
      var note = el('p', 'note');
      fill(note, tx('iosNote'), txSub('iosNote'));
      body.appendChild(note);
    } else {
      var ol2 = el('ol');
      ol2.appendChild(stepLi('and1'));
      ol2.appendChild(stepLi('and2'));
      body.appendChild(ol2);
    }
    det.appendChild(body);
    slot.appendChild(det);
  });
}
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installPrompt = e; renderInstall(); });
window.addEventListener('appinstalled', function () { installPrompt = null; renderInstall(); });

/* ---------------- 启动 ---------------- */
buildSetup();
buildLangRows();
bindWork();
ensureDay();
applyLang();
if (validProfile()) showWork(); else showSetup();

setInterval(checkNewDay, 30000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) checkNewDay(); });
window.addEventListener('focus', checkNewDay);
window.addEventListener('pageshow', function (e) { if (e.persisted) checkNewDay(); });

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();
